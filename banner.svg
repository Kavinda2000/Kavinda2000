<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#134E5E"/>
      <stop offset="100%" stop-color="#1c3f45"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#134E5E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#71B280" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- network mesh: links -->
  <g stroke="#64FFDA" stroke-width="1.3" opacity="0.28" fill="none">
    <path id="l1" d="M80,40 L320,60"/>
    <path id="l2" d="M320,60 L1020,50"/>
    <path id="l3" d="M1020,50 L1140,230"/>
    <path id="l4" d="M1140,230 L950,240"/>
    <path id="l5" d="M80,40 L180,220"/>
    <path id="l6" d="M180,220 L60,260"/>
    <path id="l7" d="M950,240 L1100,120"/>
    <path id="l8" d="M1100,120 L1020,50"/>
  </g>

  <!-- travelling packets -->
  <g fill="#64FFDA">
    <circle r="3"><animateMotion dur="4s" begin="0s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="5s" begin="0.6s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="4.5s" begin="1.1s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="3.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#l4"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="4.2s" begin="0.3s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="3.8s" begin="2s" repeatCount="indefinite"><mpath href="#l6"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="4.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#l7"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="4s" begin="1.4s" repeatCount="indefinite"><mpath href="#l8"/></animateMotion></circle>
  </g>

  <!-- network nodes -->
  <g fill="#64FFDA">
    <circle cx="80" cy="40" r="4"><animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="60" r="4"><animate attributeName="r" values="4;6;4" dur="3.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="50" r="4"><animate attributeName="r" values="4;6;4" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="230" r="4"><animate attributeName="r" values="4;6;4" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="240" r="4"><animate attributeName="r" values="4;6;4" dur="3.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="220" r="4"><animate attributeName="r" values="4;6;4" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="260" r="4"><animate attributeName="r" values="4;6;4" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="120" r="4"><animate attributeName="r" values="4;6;4" dur="3.8s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="600" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" opacity="0">
    M.D.K. DILSHAN
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
  </text>

  <!-- subtitle -->
  <text x="600" y="178" text-anchor="middle" font-family="Consolas, Fira Code, monospace" font-size="19" fill="#64FFDA" filter="url(#glow)" opacity="0">
    Network &amp; Telecom Engineer · Open RAN Security Researcher
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- waving footer band -->
  <path fill="url(#wave)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,270 C150,250 300,290 450,270 C600,250 750,290 900,270 C1050,250 1150,270 1200,260 L1200,300 L0,300 Z;
        M0,280 C150,300 300,260 450,280 C600,300 750,260 900,280 C1050,300 1150,280 1200,290 L1200,300 L0,300 Z;
        M0,270 C150,250 300,290 450,270 C600,250 750,290 900,270 C1050,250 1150,270 1200,260 L1200,300 L0,300 Z"/>
  </path>
</svg>
